name: release.yml

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# Needed to push the version commit + tag and to create the release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version in app/build.gradle.kts
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          FILE=app/build.gradle.kts

          current=$(grep -oP 'versionName = "\K[^"]+' "$FILE")
          code=$(grep -oP 'versionCode = \K[0-9]+' "$FILE")

          IFS=. read -r major minor patch <<< "$current"
          minor=${minor:-0}
          patch=${patch:-0}

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="$major.$minor.$patch"
          newcode=$((code + 1))

          sed -i "s/versionName = \".*\"/versionName = \"$new\"/" "$FILE"
          sed -i "s/versionCode = [0-9]*/versionCode = $newcode/" "$FILE"

          echo "Bumping $current ($code) -> $new ($newcode)"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Only commit/tag after the build succeeded, so a failed build
      # never leaves a bumped version on main.
      - name: Commit version bump and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Stromr-v$VERSION.apk"
          gh release create "v$VERSION" "Stromr-v$VERSION.apk" \
            --title "Strömr v$VERSION" \
            --generate-notes